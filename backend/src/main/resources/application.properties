# ─────────────────────────────────────────────
# Satyam Hardware & Paint — Application Config
# ─────────────────────────────────────────────

# Server
server.port=8080
server.servlet.context-path=/api

# ─── Database ───────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/satyam_paintshop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ─── JPA / Hibernate ────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT ────────────────────────────────────
# Change this secret in production — must be >= 256 bits (32+ chars)
app.jwt.secret=SatyamHardwarePaintGhazipurSecretKey2024SuperSecure
app.jwt.expiration-ms=86400000

# ─── CORS ───────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ─── Logging ────────────────────────────────
logging.level.com.satyam=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ─── Actuator (optional) ────────────────────
management.endpoints.web.exposure.include=health,info
